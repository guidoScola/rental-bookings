<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reservas{% endblock %}</title>
  <style>
    :root { --accent: #1f6f8b; --muted: #666; --border: #ddd; --bad: #b3261e; --good: #1e7b34; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; background: #f6f7f9; font-size: 16px; }
    header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header a, header button { color: #fff; text-decoration: none; font-weight: 600; background: none; border: 0; font-size: 16px; cursor: pointer; padding: 0; }
    header .spacer { flex: 1; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .flash { background: #e6f4ea; border: 1px solid #b7dfc2; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .error { background: #fdecea; border: 1px solid #f5c2bd; color: var(--bad); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: .9rem; }
    .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .8rem; font-weight: 600; }
    .tag.paid { background: #e6f4ea; color: var(--good); }
    .tag.unpaid { background: #fff4e5; color: #8a5300; }
    .tag.off { background: #eee; color: var(--muted); }
    form.stack label { display: block; margin-top: 12px; font-weight: 600; }
    form.stack input, form.stack select, form.stack textarea { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 16px; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; font-size: 16px; text-decoration: none; cursor: pointer; margin-top: 16px; }
    .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    .btn.danger { background: var(--bad); }
    a.card { display: block; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  {% if not hide_nav %}
  <header>
    <a href="/">Reservas</a>
    <a href="/bookings/new">+ Nueva reserva</a>
    <a href="/apartments">Departamentos</a>
    <span class="spacer"></span>
    <form method="post" action="/logout"><button type="submit">Salir</button></form>
  </header>
  {% endif %}
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
